plugins {
    id 'com.android.application'
}

// 版本号由 CI 传入（形如 2026.10.28.1），本地直接构建时用占位值
def appVersionName = (project.findProperty('appVersion') ?: '0.0.0').toString()
def appVersionDigits = appVersionName.replaceAll('[^0-9]', '')

// 固定签名密钥：由 CI 首次构建时生成并提交到 android/signing/keystore.p12
// 只有用同一把钥匙签名，安装过的旧版本才能被覆盖更新
def signingStore = rootProject.file('signing/keystore.p12')

android {
    namespace 'io.github.ihatobatsugui.firefightfont'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.ihatobatsugui.firefightfont'
        minSdk 26
        targetSdk 34
        versionCode appVersionDigits ? appVersionDigits.toInteger() : 1
        versionName appVersionName
    }

    signingConfigs {
        release {
            if (signingStore.exists()) {
                storeFile signingStore
                storeType 'PKCS12'
                storePassword 'firefight'
                keyAlias 'firefight'
                keyPassword 'firefight'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingStore.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
