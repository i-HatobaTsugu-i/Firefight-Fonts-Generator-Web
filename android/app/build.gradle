plugins {
    id 'com.android.application'
}

// 版本号由 CI 传入（形如 2026.10.28.1），本地直接构建时用占位值
def appVersionName = (project.findProperty('appVersion') ?: '0.0.0').toString()
def appVersionDigits = appVersionName.replaceAll('[^0-9]', '')

android {
    namespace 'io.github.ihatobatsugui.firefightfont'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.ihatobatsugui.firefightfont'
        minSdk 26
        targetSdk 34
        versionCode appVersionDigits ? appVersionDigits.toInteger() : 1
        versionName appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
