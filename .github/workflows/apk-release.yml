name: Build APK and release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.aicode/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" index.html | head -1)
          if [ -z "$VERSION" ]; then
            echo "index.html 里没找到 APP_VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copy web app into assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace -PappVersion=${{ steps.version.outputs.value }}

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/Firefight-Font-Generator-${{ steps.version.outputs.value }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.value }}
          path: out/*.apk

      - name: Build release notes
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          PREV=$(git tag --sort=-creatordate | head -1)
          {
            echo "## 版本 $VERSION"
            echo ""
            echo "**下载**：见下方 Assets 里的 \`Firefight-Font-Generator-$VERSION.apk\`"
            echo ""
            echo "### 本次更新"
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty=format:"- %s" "$PREV..HEAD"
            else
              git log --no-merges --pretty=format:"- %s" -20
            fi
            echo ""
            if [ -n "$PREV" ]; then
              echo ""
              echo "**完整对比**：https://github.com/${{ github.repository }}/compare/$PREV...$VERSION"
            fi
          } > notes.md
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: ${{ steps.version.outputs.value }}
          body_path: notes.md
          files: out/*.apk
